# Render Blueprint — Oak House Church website (React + Node/Express + MySQL on Aiven). One service serves the site and the API.
# Render dashboard → New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for on first deploy.
services:
  - type: web
    name: oakhouse-church
    runtime: node
    # Testing: free plan. It has no persistent disk or pre-deploy step, so uploaded images are lost on every
    # deploy/restart and the DB setup runs in the build. For launch: plan starter, uncomment preDeployCommand
    # and the disk + UPLOAD_DIR below, and drop `&& npm run db:setup` from the build.
    plan: free
    region: frankfurt # closest Render region to Lagos
    rootDir: website
    buildCommand: npm ci --include=dev && npm run build && npm run db:setup # db:setup is idempotent, never overwrites content
    # preDeployCommand: npm run db:setup
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # disk:
    #   name: uploads
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # - key: UPLOAD_DIR
      #   value: /var/data/uploads
      - key: DATABASE_URL # Aiven "Service URI" (mysql://avnadmin:…@…:24572/ohc_db?ssl-mode=REQUIRED)
        sync: false
      - key: YOUTUBE_CHANNEL_ID
        value: UCFA5ZQKPtYYMCzRzOq7rA3g
      - key: YOUTUBE_LIVE_CHANNEL_ID
        value: UCu27rtNX51H-aHvH4IFRbVA
      - key: YOUTUBE_CACHE_MINUTES
        value: "30"
      # Optional e-mail notifications for new enquiries
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_EMAIL
        value: contact@oakhousechurch.org
